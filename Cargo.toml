[package]
name = "bili-tools"
version = "0.1.6"
edition = "2024"
description = "B站工具箱 (Bilibili CLI toolbox)"
repository = "https://github.com/qwerprog/bili-tools"
homepage = "https://github.com/qwerprog/bili-tools"

[[bin]]
name = "bt"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"

[dependencies]

image = { version = "0.25.10", default-features = false, features = ["png"] }
qrcode = "0.14.1"
# reqwest = { version = "0.12.15", features = [
#     "blocking",
#     "json",
# ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", default-features = false, features = [
    "alloc",
] }
minreq = { version = "2.14.1", default-features = false, features = ["https-rustls"] }
thiserror = { version = "2.0.18", default-features = false }
log = { version = "0.4.30", default-features = false }
env_logger = { version = "0.11.10", default-features = false }
chrono = { version = "0.4.44", features = ["serde"] }

clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6"
crossterm = "0.28"
md5 = "0.7"
base64 = "0.22"
rand = "0.8"
serde_urlencoded = "0.7"
url = "2.5"
rsa = { version = "0.9.10", features = ["pem"] }
uuid = { version = "1", features = ["v4"] }
dialoguer = "0.12"
unicode-width = "0.2"
dirs = "6"
ctrlc = "3.4"

tempfile = "3"

# Web 登录需要保留多条 Set-Cookie；minreq 的响应头 HashMap 会覆盖它们。
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
