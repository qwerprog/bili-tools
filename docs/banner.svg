<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="bili-tools (bit) - Bilibili CLI Toolbox">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="biliGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB7299"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#23ADE5"/>
    </linearGradient>
    <linearGradient id="tvStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7299"/>
      <stop offset="100%" stop-color="#23ADE5"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="20%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FB7299" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FB7299" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="85%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#23ADE5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#23ADE5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="838" height="198" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="838" height="198" rx="16" fill="url(#glowPink)"/>
  <rect x="1" y="1" width="838" height="198" rx="16" fill="url(#glowBlue)"/>

  <!-- Terminal Window Dots -->
  <circle cx="26" cy="22" r="5" fill="#ff5f56" opacity="0.85"/>
  <circle cx="44" cy="22" r="5" fill="#ffbd2e" opacity="0.85"/>
  <circle cx="62" cy="22" r="5" fill="#27c93f" opacity="0.85"/>

  <!-- Bilibili Little TV Icon -->
  <g transform="translate(52, 40)">
    <!-- Antennas -->
    <line x1="34" y1="6" x2="48" y2="24" stroke="url(#tvStroke)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="94" y1="6" x2="80" y2="24" stroke="url(#tvStroke)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Outer Frame -->
    <rect x="10" y="24" width="108" height="80" rx="18" fill="#161b22" stroke="url(#tvStroke)" stroke-width="4.5"/>
    <!-- Inner Screen -->
    <rect x="21" y="35" width="86" height="58" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <!-- Eyes -->
    <line x1="39" y1="53" x2="53" y2="62" stroke="#FB7299" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="89" y1="53" x2="75" y2="62" stroke="#23ADE5" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Mouth (w) -->
    <path d="M54 71 Q59 78 64 71 Q69 78 74 71" fill="none" stroke="#e6edf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Feet -->
    <rect x="31" y="104" width="12" height="9" rx="4" fill="#FB7299"/>
    <rect x="85" y="104" width="12" height="9" rx="4" fill="#23ADE5"/>
  </g>

  <!-- Pixel Title: BILI-TOOLS (5x5 pixel font, unit=7, cell=6, rx=1.2) -->
  <g transform="translate(220, 44)" fill="url(#biliGrad)">
    <!-- B -->
    <rect x="0" y="0" width="20" height="6" rx="1.2"/>
    <rect x="0" y="7" width="6" height="6" rx="1.2"/><rect x="21" y="7" width="6" height="6" rx="1.2"/>
    <rect x="0" y="14" width="20" height="6" rx="1.2"/>
    <rect x="0" y="21" width="6" height="6" rx="1.2"/><rect x="21" y="21" width="6" height="6" rx="1.2"/>
    <rect x="0" y="28" width="20" height="6" rx="1.2"/>

    <!-- I (x=36) -->
    <rect x="36" y="0" width="20" height="6" rx="1.2"/>
    <rect x="43" y="7" width="6" height="20" rx="1.2"/>
    <rect x="36" y="28" width="20" height="6" rx="1.2"/>

    <!-- L (x=65) -->
    <rect x="65" y="0" width="6" height="27" rx="1.2"/>
    <rect x="65" y="28" width="24" height="6" rx="1.2"/>

    <!-- I (x=98) -->
    <rect x="98" y="0" width="20" height="6" rx="1.2"/>
    <rect x="105" y="7" width="6" height="20" rx="1.2"/>
    <rect x="98" y="28" width="20" height="6" rx="1.2"/>

    <!-- - (x=127) -->
    <rect x="127" y="14" width="18" height="6" rx="1.2"/>

    <!-- T (x=154) -->
    <rect x="154" y="0" width="27" height="6" rx="1.2"/>
    <rect x="164.5" y="7" width="6" height="27" rx="1.2"/>

    <!-- O (x=190) -->
    <rect x="197" y="0" width="13" height="6" rx="1.2"/>
    <rect x="190" y="7" width="6" height="20" rx="1.2"/>
    <rect x="211" y="7" width="6" height="20" rx="1.2"/>
    <rect x="197" y="28" width="13" height="6" rx="1.2"/>

    <!-- O (x=226) -->
    <rect x="233" y="0" width="13" height="6" rx="1.2"/>
    <rect x="226" y="7" width="6" height="20" rx="1.2"/>
    <rect x="247" y="7" width="6" height="20" rx="1.2"/>
    <rect x="233" y="28" width="13" height="6" rx="1.2"/>

    <!-- L (x=262) -->
    <rect x="262" y="0" width="6" height="27" rx="1.2"/>
    <rect x="262" y="28" width="24" height="6" rx="1.2"/>

    <!-- S (x=295) -->
    <rect x="302" y="0" width="20" height="6" rx="1.2"/>
    <rect x="295" y="7" width="6" height="6" rx="1.2"/>
    <rect x="302" y="14" width="13" height="6" rx="1.2"/>
    <rect x="316" y="21" width="6" height="6" rx="1.2"/>
    <rect x="295" y="28" width="20" height="6" rx="1.2"/>

    <!-- Command Badge `bit` -->
    <g transform="translate(342, 4)">
      <rect x="0" y="0" width="46" height="26" rx="7" fill="#21262d" stroke="#30363d" stroke-width="1.2"/>
      <text x="23" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#23ADE5">bit</text>
    </g>
  </g>

  <!-- Subtitle -->
  <text x="220" y="108" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="500" fill="#e6edf3">
    Bilibili CLI Toolbox · 一站式 B 站命令行工具箱
  </text>

  <!-- Feature Pills -->
  <g transform="translate(220, 128)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <rect x="0" y="0" width="52" height="24" rx="12" fill="#FB7299" fill-opacity="0.14" stroke="#FB7299" stroke-opacity="0.45"/>
    <text x="26" y="16" text-anchor="middle" fill="#FB7299">Live</text>

    <rect x="60" y="0" width="60" height="24" rx="12" fill="#23ADE5" fill-opacity="0.14" stroke="#23ADE5" stroke-opacity="0.45"/>
    <text x="90" y="16" text-anchor="middle" fill="#23ADE5">Video</text>

    <rect x="128" y="0" width="68" height="24" rx="12" fill="#C084FC" fill-opacity="0.14" stroke="#C084FC" stroke-opacity="0.45"/>
    <text x="162" y="16" text-anchor="middle" fill="#C084FC">Upload</text>

    <rect x="204" y="0" width="68" height="24" rx="12" fill="#3FB950" fill-opacity="0.14" stroke="#3FB950" stroke-opacity="0.45"/>
    <text x="238" y="16" text-anchor="middle" fill="#3FB950">Search</text>

    <rect x="280" y="0" width="48" height="24" rx="12" fill="#F0883E" fill-opacity="0.14" stroke="#F0883E" stroke-opacity="0.45"/>
    <text x="304" y="16" text-anchor="middle" fill="#F0883E">Fav</text>

    <rect x="336" y="0" width="76" height="24" rx="12" fill="#8B949E" fill-opacity="0.14" stroke="#8B949E" stroke-opacity="0.45"/>
    <text x="374" y="16" text-anchor="middle" fill="#c9d1d9">History</text>

    <rect x="420" y="0" width="54" height="24" rx="12" fill="#F78166" fill-opacity="0.14" stroke="#F78166" stroke-opacity="0.45"/>
    <text x="447" y="16" text-anchor="middle" fill="#F78166">Rust</text>
  </g>
</svg>
