name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target_x86: x86_64-pc-windows-msvc
            target_arm: aarch64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            target_x86: x86_64-apple-darwin
            target_arm: aarch64-apple-darwin
          - platform: linux
            os: ubuntu-latest
            target_x86: x86_64-unknown-linux-gnu
            target_arm: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target_x86 }},${{ matrix.target_arm }}
      - name: Install Linux cross-compiler
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure build
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = windows ]; then
            echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
          fi
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - name: Check release version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          test -f "docs/releases/v${VERSION}.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${VERSION}"
          fi
      - name: Test
        run: cargo test --locked
      - name: Build x86_64
        run: cargo build --target ${{ matrix.target_x86 }} --release --locked
      - name: Build ARM64
        run: cargo build --target ${{ matrix.target_arm }} --release --locked
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path dist
          Compress-Archive -Path target/${{ matrix.target_x86 }}/release/bit.exe -DestinationPath "dist/bit-v${version}-windows-amd64.zip"
          Compress-Archive -Path target/${{ matrix.target_arm }}/release/bit.exe -DestinationPath "dist/bit-v${version}-windows-arm64.zip"
      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p dist
          zip -j "dist/bit-v${VERSION}-darwin-amd64.zip" target/${{ matrix.target_x86 }}/release/bit
          zip -j "dist/bit-v${VERSION}-darwin-arm64.zip" target/${{ matrix.target_arm }}/release/bit
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          mkdir -p dist
          tar -czf "dist/bit-v${VERSION}-linux-amd64.tar.gz" -C target/${{ matrix.target_x86 }}/release bit
          tar -czf "dist/bit-v${VERSION}-linux-arm64.tar.gz" -C target/${{ matrix.target_arm }}/release bit
      - uses: actions/upload-artifact@v7
        with:
          name: bt-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bt-*
          path: dist
          merge-multiple: true
      - name: Verify artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          cd dist
          for name in "bit-v${VERSION}-windows-amd64.zip" "bit-v${VERSION}-windows-arm64.zip" "bit-v${VERSION}-darwin-amd64.zip" "bit-v${VERSION}-darwin-arm64.zip" "bit-v${VERSION}-linux-amd64.tar.gz" "bit-v${VERSION}-linux-arm64.tar.gz"; do
            test -s "$name"
          done
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "../docs/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "../docs/releases/${GITHUB_REF_NAME}.md" --draft
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" bit-* --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
